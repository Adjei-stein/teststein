# Local development services. Start with:  docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: teststein
      POSTGRES_PASSWORD: teststein
      POSTGRES_DB: teststein
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teststein"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

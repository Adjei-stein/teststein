<header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/80 px-4 backdrop-blur sm:px-6 lg:px-8">
  <button type="button" class="btn-icon -ml-1 lg:hidden" (click)="openMenu.emit()" aria-label="Open menu">
    <mat-icon class="icon-24">menu</mat-icon>
  </button>

  <!-- Search (not wired up yet) -->
  <label class="relative hidden w-full max-w-md sm:block">
    <span class="sr-only">Search</span>
    <mat-icon class="icon-20 pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</mat-icon>
    <input
      id="search-box"
      type="search"
      placeholder="Search projects, test cases, runs…"
      class="field-input h-9 bg-slate-50 pl-10 shadow-none"
    />
  </label>

  <div class="ml-auto flex items-center gap-2">
    <a routerLink="/projects/new" class="btn btn-primary hidden h-9 px-3 md:inline-flex">
      <mat-icon class="icon-18">add</mat-icon>
      New project
    </a>

    <button type="button" class="btn-icon" aria-label="Notifications">
      <mat-icon class="icon-20">notifications</mat-icon>
    </button>

    <!-- User menu -->
    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg p-1 pr-2 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
        (click)="toggleDropdown()"
        [attr.aria-expanded]="dropdownOpen()"
        aria-haspopup="menu"
      >
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand text-xs font-semibold text-brand-fg">{{ initials() }}</span>
        <span class="hidden text-sm font-medium text-slate-700 md:inline">{{ firstName() }}</span>
        <mat-icon class="icon-18 hidden text-slate-400 md:inline-block">expand_more</mat-icon>
      </button>

      @if (dropdownOpen()) {
        <div class="absolute right-0 mt-2 w-64 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg" role="menu">
          <div class="flex items-center gap-3 border-b border-slate-100 px-4 py-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand text-sm font-semibold text-brand-fg">{{ initials() }}</span>
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-slate-900">{{ user()?.name }}</p>
              <p class="truncate text-xs text-slate-500">{{ user()?.email }}</p>
            </div>
          </div>
          <div class="p-1">
            <a routerLink="/settings" (click)="dropdownOpen.set(false)" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100" role="menuitem">
              <mat-icon class="icon-18 text-slate-500">person</mat-icon> Profile
            </a>
            <a routerLink="/settings" (click)="dropdownOpen.set(false)" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100" role="menuitem">
              <mat-icon class="icon-18 text-slate-500">settings</mat-icon> Settings
            </a>
            <button type="button" (click)="logout()" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100" role="menuitem">
              <mat-icon class="icon-18 text-slate-500">logout</mat-icon> Sign out
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
